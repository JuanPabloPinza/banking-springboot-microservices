spring:
  application:
    name: accounts-microservices
  datasource:
    url: jdbc:postgresql://localhost:5434/banca
    username: ms_cuentas
    password: ms_cuentas_pwd
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cuentas
  rabbitmq:
    host: localhost
    port: 5672
    username: banca
    password: banca
    listener:
      simple:
        observation-enabled: true
        concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/banca
          jwk-set-uri: http://localhost:8180/realms/banca/protocol/openid-connect/certs

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false
