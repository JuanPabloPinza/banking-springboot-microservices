name: banca

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/01-BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banca"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: banca
      RABBITMQ_DEFAULT_PASS: banca
    ports:
      - "5672:5672"
      - "15672:15672" # Consola
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
