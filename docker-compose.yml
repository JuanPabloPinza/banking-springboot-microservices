name: banca

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banca
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./BaseDatos.sql:/docker-entrypoint-initdb.d/01-BaseDatos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banca"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: banca
      RABBITMQ_DEFAULT_PASS: banca
    ports:
      - "5672:5672"
      - "15672:15672" # Consola
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  clients-microservices:
    build: ./clients-microservices
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banca
      SPRING_RABBITMQ_HOST: rabbitmq
      TZ: America/Guayaquil
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  accounts-microservices:
    build: ./accounts-microservices
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/banca
      SPRING_RABBITMQ_HOST: rabbitmq
      TZ: America/Guayaquil
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  pgdata:
