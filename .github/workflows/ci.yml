name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build y pruebas (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [clients-microservices, accounts-microservices]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml

      - name: Compilar, ejecutar pruebas y verificar cobertura
        run: ./mvnw -B verify

      - name: Pruebas de mutación
        run: ./mvnw -B org.pitest:pitest-maven:mutationCoverage

      - name: Publicar reportes de cobertura y mutación
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes-${{ matrix.servicio }}
          path: |
            ${{ matrix.servicio }}/target/site/jacoco
            ${{ matrix.servicio }}/target/pit-reports
          if-no-files-found: ignore

  docker:
    name: Imágenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Construir imágenes
        run: docker compose build

  publicar:
    name: Publicar imagen (${{ matrix.servicio }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [clients-microservices, accounts-microservices]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.servicio }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.servicio }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
