name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build y pruebas (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [clients-microservices, accounts-microservices]
    defaults:
      run:
        working-directory: ${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.servicio }}/pom.xml

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B verify
